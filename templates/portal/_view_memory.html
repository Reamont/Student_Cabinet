{% if view_memory %}<form class="view-memory" method="post" action="{% url 'preference_save' %}" data-view-memory>{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">{% for key,value in view_memory.items %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}<button class="text-button" type="submit" data-memory-retry>Запомнить этот вид</button><span role="status" aria-live="polite" data-memory-status></span></form>{% endif %}
