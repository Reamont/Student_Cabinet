# Install after obtaining a real certificate. Replace campus.example.org everywhere.
# The app port must stay bound to loopback; only this trusted proxy may set
# X-Forwarded-Proto. Do not forward a client-provided value.
# Loaded inside nginx's http context (sites-enabled). Empty keys are not limited.
map "$request_method:$uri" $campus_login_key {
    default "";
    ~^POST:/(admin/)?login/$ $binary_remote_addr;
}
limit_req_zone $campus_login_key zone=campus_login:10m rate=3r/m;

server {
    listen 80;
    server_name campus.example.org;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name campus.example.org;
    ssl_certificate /etc/letsencrypt/live/campus.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    access_log off;
    # Shared by student/staff login, isolated by the actual connection address.
    limit_req zone=campus_login burst=39 nodelay;
    limit_req_status 429;
    error_page 429 = @login_limited;

    location @login_limited {
        default_type text/html;
        charset utf-8;
        add_header Retry-After 20 always;
        add_header Cache-Control no-store always;
        return 429 '<!doctype html><html lang="ru"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Попробуйте позже</title><h1>Слишком много попыток входа</h1><p>Подождите 20 секунд и повторите вход.</p><a href="/login/">Вернуться ко входу</a></html>';
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
}
