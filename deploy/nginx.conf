# Install after obtaining a real certificate. Replace campus.example.org everywhere.
# The app port must stay bound to loopback; only this trusted proxy may set
# X-Forwarded-Proto. Do not forward a client-provided value.
server {
    listen 80;
    server_name campus.example.org;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name campus.example.org;
    ssl_certificate /etc/letsencrypt/live/campus.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
}
